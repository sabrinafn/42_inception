services:
  mariadb:
    build: requirements/mariadb/.
    container_name: mariadb
    volumes:
      - ./database:/var/lib/mysql
    networks:
      inception:
    env_file:
      - .env
    secrets:
      - mariadb_root_password
  nginx:
    build: requirements/nginx/.
    container_name: nginx
    ports:
      - 80:80
    volumes:
      - ./web:/var/www/html
    networks:
      inception:
    env_file:
      - .env
    depends_on:
      - wordpress
  wordpress:
    build: requirements/wordpress/.
    container_name: wp-php
    volumes:
      - ./web:/var/www/html
    networks:
      inception:
    env_file:
      - .env
    depends_on:
      - mariadb

networks:
  inception:

secrets:
  mariadb_root_password:
    file: ../secrets/db_root_password.txt