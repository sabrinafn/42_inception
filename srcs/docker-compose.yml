services:

  mariadb:
    build: requirements/mariadb/.
    container_name: mariadb
    volumes:
      - mariadb_volume:/var/lib/mysql
    networks:
      inception:
    env_file:
      - .env
    secrets:
      - mariadb_root_password
      - mariadb_password
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    build: requirements/nginx/.
    container_name: nginx
    ports:
      - 443:443
    volumes:
      - wordpress_volume:/var/www/wordpress:ro
    networks:
      inception:
    env_file:
      - .env
    depends_on:
      - wordpress

  wordpress:
    build: requirements/wordpress/.
    container_name: wordpress
    volumes:
      - wordpress_volume:/var/www/wordpress
    networks:
      inception:
    env_file:
      - .env
    secrets:
      - wp_admin_password
      - wp_user_password
      - mariadb_password
    depends_on:
      mariadb:
        condition: service_healthy

volumes:

  mariadb_volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DATA_DIR}/mysql

  wordpress_volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${DATA_DIR}/wordpress

networks:
  inception:
    driver: bridge

secrets:
  mariadb_root_password:
    file: ../secrets/db_root_password.txt
  mariadb_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt